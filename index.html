      <script>
        // Detect Chromium browsers (Chrome / Edge / Brave / Opera) so we can
        // apply a color-correction filter for Display-P3 photos that Safari
        // renders correctly but Chrome washes out. Runs before React mounts
        // so the filter is in place on first paint.
        (function () {
          var ua = navigator.userAgent;
          var isSafari = /^((?!chrome|android|crios|fxios|edg|opr).)*safari/i.test(ua);
          if (!isSafari) {
            document.documentElement.setAttribute("data-browser", "chromium");
          }
        })();
      </script>
    </head>
